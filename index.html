<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>video-management</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Si el bundle no llega a ejecutarse -assets 404 por un index.html cacheado
      de un deploy anterior, red caída, bloqueo del navegador- React nunca monta
      y la pantalla queda en blanco sin explicación. Este script no depende del
      bundle: si pasados unos segundos #root sigue vacío, dice qué revisar.
    -->
    <script>
      (function () {
        var TIEMPO_MAXIMO_MS = 8000;
        var fallos = [];

        window.addEventListener('error', function (e) {
          if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            fallos.push('No se pudo cargar: ' + (e.target.src || e.target.href));
          } else if (e && e.message) {
            fallos.push(e.message);
          }
        }, true);

        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) return; // la app montó bien

          root.innerHTML =
            '<div style="font-family:system-ui,-apple-system,sans-serif;max-width:640px;margin:60px auto;padding:24px;' +
            'border:1px solid #fecaca;border-radius:12px;background:#fff;color:#0f172a">' +
            '<h1 style="margin:0 0 8px;font-size:20px;color:#dc2626">La aplicación no pudo iniciarse</h1>' +
            '<p style="margin:0 0 16px;font-size:14px;color:#475569">' +
            'El código de la aplicación no llegó a ejecutarse. La causa más habitual es que el ' +
            'navegador conserve una versión anterior de la página que apunta a archivos que ya no existen.</p>' +
            '<p style="margin:0 0 8px;font-size:14px;font-weight:600">Qué hacer:</p>' +
            '<ol style="margin:0 0 16px;padding-left:20px;font-size:14px;color:#475569;line-height:1.7">' +
            '<li>Recargar forzando la actualización: <b>Cmd+Shift+R</b> (Mac) o <b>Ctrl+F5</b> (Windows).</li>' +
            '<li>Si sigue igual, verificar que el deploy haya terminado correctamente.</li>' +
            '</ol>' +
            (fallos.length
              ? '<pre style="margin:0;padding:12px;background:#0f172a;color:#e2e8f0;border-radius:8px;' +
                'font-size:12px;white-space:pre-wrap;overflow:auto;max-height:200px">' +
                fallos.join('\n').replace(/</g, '&lt;') + '</pre>'
              : '') +
            '<button onclick="location.reload(true)" style="margin-top:16px;padding:10px 18px;border:0;' +
            'border-radius:8px;background:#4f46e5;color:#fff;font-size:14px;cursor:pointer">Recargar</button>' +
            '</div>';
        }, TIEMPO_MAXIMO_MS);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
